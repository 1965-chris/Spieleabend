# Abholdienst der Spieleabend-App – holt auf Wunsch Spielangaben bei Spiele-Offensive ab.
# Das eigentliche Programm (abholdienst/abholdienst.py) legt die App selbst ins Repo und hält es aktuell.
name: Abholdienst
on:
  push:
    paths: ['abholdienst/auftraege/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: abholdienst
  cancel-in-progress: false
jobs:
  abholen:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Spielangaben abholen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" -o abholdienst.py \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/abholdienst/abholdienst.py?ref=$GITHUB_SHA"
          python3 abholdienst.py
