async function einladen(){
  const link = einladungsLink();
  const text = 'Hier ist unsere Spieleabend-App. Link öffnen, dann über „Teilen“ → „Zum Home-Bildschirm“ als App speichern. Fragt die App nach dem Link, ihn einfach noch einmal einfügen.';
  if (navigator.share){
    try{ await navigator.share({ title:'Spieleabend', text, url:link }); return; }catch(e){ if (e.name === 'AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(`${text}\n${link}`); toast('Einladung kopiert – jetzt in WhatsApp einfügen'); }
  catch(e){
    const s = sheet(`<div class="sheet-kopf"><h2>Einladungslink</h2><button class="knopf-rund" type="button" data-zu aria-label="Schließen">${ic('x')}</button></div>
      <p class="text-leise">Link markieren und kopieren:</p><textarea class="eingabe" readonly style="min-height:120px;font-size:13px">${esc(link)}</textarea>`);
    $('textarea', s).select();
  }
}
function sicherungHerunterladen(){
  const daten = { format:'spieleabend-sicherung', version:VERSION, erstellt:new Date().toISOString(), haushalte:Object.values(D.haushalte).map(dateiForm) };
  const blob = new Blob([JSON.stringify(daten, null, 1)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `spieleabend-sicherung-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function sicherungEinspielen(datei){
  try{
    const j = JSON.parse(await datei.text());
    const liste = Array.isArray(j.haushalte) ? j.haushalte : (j.id && Array.isArray(j.spiele) ? [j] : null);
    if (!liste) throw new Error('Das ist keine Spieleabend-Sicherung.');
    let n = 0;
    for (const roh of liste){
      if (!roh || !roh.id) continue;
      const h = haushaltNorm(roh);
      D.haushalte[h.id] = D.haushalte[h.id] ? zusammenfuehren(D.haushalte[h.id], h) : h;
      markiere(h.id, 'aus Sicherung eingespielt'); n++;
    }
    speichern(); renderAlles(); syncBald();
    toast(`${n} Haushalt${n === 1 ? '' : 'e'} eingespielt`);
  }catch(e){ toast(e.message || 'Die Datei ließ sich nicht lesen.', 'fehler'); }
}
async function allesNeuLaden(){
  const offen = Object.keys(D.haushalte).filter(id => (D.meta[id] || {}).dirty);
  if (!await frage('Alles neu laden?', offen.length ? 'Noch nicht hochgeladene Änderungen bleiben erhalten, alles andere wird frisch von GitHub geholt.' : 'Alle Spiele werden frisch von GitHub geholt.', 'Neu laden', false)) return;
  for (const id of Object.keys(D.haushalte)) if (!(D.meta[id] || {}).dirty){ delete D.haushalte[id]; delete D.meta[id]; }
  for (const m of Object.values(D.meta)) m.sha = null;
  speichern(); renderAlles(); await sync('von Hand');
}

/* ---------- Einladung & erster Start ---------- */
let hausFrageGezeigt = false;
function einladungLesen(text){
  const m = /einladung=([A-Za-z0-9_-]+)/.exec(text || ''); if (!m) return null;
  try{
    let b = m[1].replace(/-/g,'+').replace(/_/g,'/'); while (b.length % 4) b += '=';
    const d = JSON.parse(textAusB64(b));
    if (!d || !d.t) return null;
    return { code:m[1], owner:d.o, repo:d.r, token:d.t };
  }catch(e){ return null; }
}
function einladungUebernehmen(ein){
  const wechsel = (ein.owner && ein.owner !== E.owner) || (ein.repo && ein.repo !== E.repo);
  if (wechsel){ D = { haushalte:{}, meta:{} }; speichern(); }
  if (ein.owner) E.owner = ein.owner; if (ein.repo) E.repo = ein.repo;
  E.token = ein.token; E.einladungen = [...(E.einladungen || []).filter(c => c !== ein.code), ein.code].slice(-5);
  einstSpeichern(); hausFrageGezeigt = false;
}
function einladungPruefen(){
  const ein = einladungLesen(location.hash);
  if (!ein) return false;
  const schonDa = (E.einladungen || []).includes(ein.code) && E.token;
  if (!schonDa){ einladungUebernehmen(ein); setTimeout(() => toast('Einladung übernommen – willkommen!'), 400); }
  // In der installierten App den Link aus der Adresse nehmen; in Safari stehen lassen,
  // damit „Zum Home-Bildschirm“ ihn möglichst mitnimmt.
  if (istStandalone()) history.replaceState(null, '', location.pathname + location.search);
  return !schonDa;
}
function willkommen(){
  const s = sheet(`<div class="sheet-kopf"><h2>Willkommen!</h2><button class="knopf-rund" type="button" data-zu aria-label="Schließen">${ic('x')}</button></div>
    <p style="margin-top:-4px">Hier sammelt ihr die Spiele aller Haushalte – und findet beim Spieleabend schnell eins, das für alle passt.</p>
    <label class="feld" style="margin-top:16px"><span class="feld-titel">Einladungslink einfügen</span>
      <textarea class="eingabe" id="w-link" placeholder="https://…#einladung=…" style="min-height:90px;font-size:14px" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></label>
    <button class="knopf breit" type="button" id="w-ok">Einladung übernehmen</button>
    <button class="knopf rahmen breit" type="button" id="w-selbst" style="margin-top:10px">Ich richte die App selbst ein</button>`);
  $('#w-ok', s).addEventListener('click', () => {
    const ein = einladungLesen($('#w-link', s).value);
    if (!ein){ toast('Das sieht nicht nach einem Einladungslink aus.', 'fehler'); return; }
    einladungUebernehmen(ein); s.schliessen(); toast('Einladung übernommen – willkommen!'); renderAlles(); sync('Einladung');
  });
  $('#w-selbst', s).addEventListener('click', () => { s.schliessen(); seiteZeigen('einstellungen'); });
}
function hausFrage(versuch=0){
  if (hausFrageGezeigt || !E.token || S.fehler || !S.letzter) return;
  if (E.meinHaushalt && D.haushalte[E.meinHaushalt]) return;
  if (offeneSheets || $('.wurf')){ if (versuch < 30) setTimeout(() => hausFrage(versuch + 1), 500); return; }
  hausFrageGezeigt = true;
  const liste = haushaltListe();
  const s = sheet(`<div class="sheet-kopf"><h2>Zu welchem Haushalt gehörst du?</h2><button class="knopf-rund" type="button" data-zu aria-label="Später">${ic('x')}</button></div>
    <p class="text-leise" style="margin-top:-4px">Deine neuen Spiele landen dann automatisch dort.</p>
    <div class="hh-liste" style="margin-top:12px">${liste.map(h => `<button class="hh" type="button" data-hh-wahl="${esc(h.id)}" style="--hf:${esc(h.farbe)}"><span class="hh-figur">${figur(h.farbe, 28)}</span><span class="hh-text"><span class="hh-name">${esc(h.name)}</span><span class="hh-info">${h.spiele.length} Spiele</span></span></button>`).join('')}</div>
    <button class="knopf breit" type="button" data-hh-neu>${ic('plus')}Neuen Haushalt anlegen</button>`);
  s.addEventListener('click', e => {
    const w = e.target.closest('[data-hh-wahl]');
    if (w){ E.meinHaushalt = w.dataset.hhWahl; einstSpeichern(); s.schliessen(); renderAlles(); toast('Alles klar!'); }
    if (e.target.closest('[data-hh-neu]')){ s.schliessen(); setTimeout(() => haushaltFormular(null), 200); }
  });
}
function installHinweis(){
  const el = $('#install-hinweis');
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios || istStandalone() || lesen(LS.hinweis, false)){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="hinweis install"><p>Tipp: Über <b>Teilen</b> → <b>Zum Home-Bildschirm</b> wird der Spieleabend zur App auf deinem iPhone.</p>
    <button class="knopf-rund" type="button" aria-label="Hinweis ausblenden" id="install-zu">${ic('x')}</button></div>`;
  $('#install-zu').addEventListener('click', () => { schreiben(LS.hinweis, true); el.innerHTML = ''; });
}

/* ---------- Navigation & Verdrahtung ---------- */
let aktiveSeite = 'spiele';
function seiteZeigen(name){
  aktiveSeite = name;
  $$('.seite').forEach(s => s.classList.toggle('aktiv', s.id === 'seite-' + name));
  $$('.tabs button').forEach(b => { if (b.dataset.seite === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  $('#plus').classList.toggle('versteckt', name !== 'spiele' || !Object.keys(D.haushalte).length);
  renderSeite(name);
  window.scrollTo(0, 0);
}
function renderSeite(name){
  if (name === 'spiele') renderSpiele();
  if (name === 'runde') renderRunde();
  if (name === 'haushalte') renderHaushalte();
  if (name === 'einstellungen') renderEinstellungen();
}
function renderAlles(){
  renderSpiele();
  if (aktiveSeite !== 'spiele') renderSeite(aktiveSeite);
  $('#plus').classList.toggle('versteckt', aktiveSeite !== 'spiele' || !Object.keys(D.haushalte).length);
  statusZeigen();
}

function verdrahten(){
  $$('.tabs button').forEach(b => b.addEventListener('click', () => seiteZeigen(b.dataset.seite)));
  document.addEventListener('toggle', e => {
    const d = e.target;
    if (d && d.matches && d.matches('details[data-klapp]') && KL[d.dataset.klapp] !== d.open){ KL[d.dataset.klapp] = d.open; schreiben(LS.klapp, KL); }
  }, true);
  $('#plus').addEventListener('click', () => spielFormular());
  $('#filter-auf').addEventListener('click', filterSheet);
  $('#sync-knopf').addEventListener('click', () => { if (S.fehler) toast(S.fehler, 'fehler'); sync('von Hand'); });
  let suchTimer = null;
  $('#suche').addEventListener('input', e => { clearTimeout(suchTimer); suchTimer = setTimeout(() => { F.suche = e.target.value; renderSpiele(); }, 150); });
  $('#filter-leiste').addEventListener('click', e => {
    const c = e.target.closest('[data-weg]'); if (!c) return;
    const k = c.dataset.weg;
    if (k === 'personen') F.personen = null;
    else if (k === 'alter') F.alter = null;
    else if (k === 'dauerMax') F.dauerMax = null;
    else if (k.startsWith('kat:')) F.kategorien = F.kategorien.filter(x => x !== k.slice(4));
    else if (k.startsWith('hh:')) F.haushalte = F.haushalte.filter(x => x !== k.slice(3));
    schreiben(LS.filter, F); renderSpiele();
  });
  document.addEventListener('click', e => {
    const k = e.target.closest('[data-spiel]'); if (k && !k.closest('.sheet')){ spielDetail(k.dataset.spiel); return; }
    const hha = e.target.closest('[data-hha]'); if (hha){ haushaltAktion(hha.dataset.hha, hha.dataset.id); return; }
    const a = e.target.closest('[data-aktion]');
    if (a){
      const was = a.dataset.aktion;
      if (was === 'haushalt-neu') haushaltFormular(null);
      if (was === 'spiel-neu') spielFormular();
      if (was === 'einstellungen') seiteZeigen('einstellungen');
      if (was === 'filter-weg'){ filterZuruecksetzen(); $('#suche').value = ''; F.suche = ''; renderSpiele(); }
    }
    if (e.target.closest('[data-wuerfeln]')) wuerfeln();
  });
  const runde = $('#runde-inhalt');
  runde.addEventListener('wert', e => { const n = e.target.dataset.name; if (n === 'personen') R.personen = e.detail ?? 1; if (n === 'alter') R.alter = e.detail; rundeSpeichern(); });
  runde.addEventListener('wahl', e => {
    const g = e.target.dataset.gruppe, w = e.detail;
    if (g === 'dabei') R.ohne = Object.keys(D.haushalte).filter(id => !w.includes(id));
    if (g === 'dauer') R.dauerMax = w.length ? +w[0] : null;
    if (g === 'kat') R.kategorien = w;
    rundeSpeichern();
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - S.letzter > 60000) sync('App geöffnet'); });
  addEventListener('online', () => sync('wieder online'));
  addEventListener('offline', statusZeigen);
  addEventListener('hashchange', () => { if (einladungPruefen()){ renderAlles(); sync('Einladung'); } });
  setInterval(() => { if (document.visibilityState === 'visible') sync('regelmäßig'); }, 5 * 60 * 1000);
}

function start(){
  const eingeladen = einladungPruefen();
  verdrahten();
  installHinweis();
  seiteZeigen('spiele');
  if (!E.token && !Object.keys(D.haushalte).length && !eingeladen) setTimeout(willkommen, 350);
  sync(eingeladen ? 'Einladung' : 'Start');
}
start();
</script>
