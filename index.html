<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spieleabend">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Spieleabend</title>
<style>
:root{
  --grund:#F1F3F0; --karte:#FFFFFF; --tinte:#1C2230; --leise:#5E6776; --linie:#DADFD7;
  --filz:#1E6B52; --filz-hell:#E2EEE8; --filz-tinte:#FFFFFF;
  --gelb:#F2B705; --gelb-tinte:#2A2200; --rot:#C93C3C;
  --schatten:0 1px 2px rgba(20,30,25,.06), 0 6px 18px rgba(20,30,25,.07);
  --rund: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", sans-serif;
  --text: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tabhoehe: 64px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --grund:#12161C; --karte:#1B2129; --tinte:#ECEFF3; --leise:#9AA3B0; --linie:#2B333E;
    --filz:#47B98D; --filz-hell:#17332A; --filz-tinte:#08170F;
    --gelb:#F5C542; --gelb-tinte:#241C00; --rot:#E46565;
    --schatten:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--grund); color:var(--tinte);
  font:16px/1.45 var(--text);
  padding-bottom:calc(var(--tabhoehe) + env(safe-area-inset-bottom) + 24px);
  -webkit-tap-highlight-color:transparent;
}
body.modal-offen{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb, var(--filz) 60%, transparent); outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.figur{flex:none}
.versteckt{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Kopf ---------- */
.kopf{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--grund) 92%, transparent);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
.kopf-innen{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.titel{margin:0;font-family:var(--rund);font-weight:800;font-size:27px;letter-spacing:-.015em;display:flex;align-items:center;gap:9px}
.titel .marke{width:30px;height:30px;border-radius:9px;background:var(--filz);display:grid;place-items:center}
.titel .marke svg{width:22px;height:22px}
.sync{
  appearance:none;border:1px solid var(--linie);background:var(--karte);border-radius:999px;
  padding:6px 11px 6px 9px;font-size:13px;color:var(--leise);display:inline-flex;align-items:center;gap:7px;white-space:nowrap
}
.sync i{width:9px;height:9px;border-radius:50%;background:#9AA3B0;display:block}
.sync[data-k="ok"] i{background:#2E9E5B}
.sync[data-k="laeuft"] i{background:var(--gelb);animation:puls 1s ease-in-out infinite}
.sync[data-k="fehler"] i{background:var(--rot)}
@keyframes puls{50%{opacity:.35}}

main{max-width:1000px;margin:0 auto;padding:0 16px}
.seite{display:none}
.seite.aktiv{display:block}
.seiten-titel{font-family:var(--rund);font-weight:800;font-size:25px;letter-spacing:-.01em;margin:6px 0 4px}
.unterzeile{color:var(--leise);margin:0 0 18px}

/* ---------- Suche & Filter ---------- */
.suchreihe{display:flex;gap:8px;margin:2px 0 10px}
.suche{flex:1;position:relative}
.suche .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--leise)}
.suche input{
  width:100%;height:44px;border-radius:12px;border:1.5px solid var(--linie);background:var(--karte);
  padding:0 12px 0 40px;font-size:16px
}
.suche input:focus{border-color:var(--filz);outline:none}
.knopf-filter{
  height:44px;border-radius:12px;border:1.5px solid var(--linie);background:var(--karte);
  padding:0 13px;display:inline-flex;align-items:center;gap:6px;font-weight:600
}
.knopf-filter b{background:var(--filz);color:var(--filz-tinte);border-radius:999px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.filter-leiste{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.filter-leiste:empty{display:none}
.filter-leiste::-webkit-scrollbar{display:none}
.zaehler{color:var(--leise);font-size:14px;margin:4px 0 12px}

/* ---------- Chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  appearance:none;border:1.5px solid var(--linie);background:var(--karte);border-radius:999px;
  padding:7px 13px;font-size:15px;line-height:1.2;display:inline-flex;align-items:center;gap:6px;white-space:nowrap
}
.chip[aria-pressed="true"]{background:var(--filz);border-color:var(--filz);color:var(--filz-tinte);font-weight:600}
.chip.weg{background:var(--filz-hell);border-color:transparent;color:var(--tinte);font-weight:500}
.chip.weg .ic{width:15px;height:15px}
.chip.figur-chip[aria-pressed="true"]{background:color-mix(in srgb, var(--hf) 16%, var(--karte));border-color:var(--hf);color:var(--tinte)}
.chip.figur-chip[aria-pressed="false"]{color:var(--leise)}
.chip.figur-chip[aria-pressed="false"] .figur{opacity:.35}

/* ---------- Spielraster ---------- */
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:14px}
.karte{
  appearance:none;text-align:left;padding:0;border:0;background:var(--karte);border-radius:14px;overflow:hidden;
  box-shadow:var(--schatten);display:flex;flex-direction:column;position:relative
}
@media (prefers-color-scheme: dark){ .karte{border:1px solid var(--linie)} }
.karte:active{transform:scale(.98)}
.karte-bild,.zeile-bild,.detail-bild,.foto-vorschau{
  position:relative;display:grid;place-items:center;overflow:hidden;
  background:color-mix(in srgb, var(--hf, #888) 22%, var(--karte));
}
.karte-bild{aspect-ratio:1/1}
.karte-bild img,.zeile-bild img,.detail-bild img,.foto-vorschau img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.platzhalter{font-family:var(--rund);font-weight:800;font-size:54px;color:color-mix(in srgb, var(--hf, #888) 75%, var(--tinte));opacity:.75;line-height:1}
.hat-bild .platzhalter{visibility:hidden}
.karte-text{padding:9px 11px 11px;display:flex;flex-direction:column;gap:5px;flex:1}
.karte-name{font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.fakten{display:flex;flex-wrap:wrap;gap:4px 11px;font-size:13.5px;color:var(--leise)}
.fakten span{display:inline-flex;align-items:center;gap:4px}
.fakten .ic{width:15px;height:15px}
.karte-haushalt{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--leise);margin-top:auto;padding-top:2px}

/* ---------- Leere Zustände ---------- */
.leer{text-align:center;padding:36px 16px 12px;color:var(--leise);max-width:420px;margin:0 auto}
.leer h3{color:var(--tinte);font-family:var(--rund);font-size:20px;margin:10px 0 6px}
.leer p{margin:0 0 16px}
.leer .figuren{display:flex;justify-content:center;gap:4px}

/* ---------- Knöpfe ---------- */
.knopf{
  appearance:none;border:0;border-radius:12px;min-height:46px;padding:0 18px;font-weight:650;font-size:16px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--filz);color:var(--filz-tinte)
}
.knopf.zweit{background:var(--filz-hell);color:var(--tinte)}
.knopf.rahmen{background:transparent;border:1.5px solid var(--linie);color:var(--tinte)}
.knopf.gefahr{background:transparent;border:1.5px solid color-mix(in srgb, var(--rot) 45%, transparent);color:var(--rot)}
.knopf.gefahr-voll{background:var(--rot);color:#fff}
.knopf.breit{width:100%}
.knopf:disabled{opacity:.5}
.knopf-rund{appearance:none;border:0;background:var(--filz-hell);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.knopfreihe{display:flex;gap:10px;flex-wrap:wrap}
.knopfreihe .knopf{flex:1}
.plus{
  position:fixed;right:max(16px, calc((100vw - 1000px)/2 + 16px));bottom:calc(var(--tabhoehe) + env(safe-area-inset-bottom) + 16px);z-index:15;
  width:58px;height:58px;border-radius:50%;border:0;background:var(--filz);color:var(--filz-tinte);display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(20,60,45,.35)
}
.plus .ic{width:28px;height:28px;stroke-width:2.2}

/* ---------- Tableiste ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--karte);border-top:1px solid var(--linie);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabs-innen{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabhoehe)}
.tabs button{appearance:none;border:0;background:none;color:var(--leise);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs button .ic{width:25px;height:25px}
.tabs button[aria-current="page"]{color:var(--filz)}

/* ---------- Spielrunde ---------- */
.block{background:var(--karte);border-radius:16px;padding:14px 14px 16px;margin-bottom:12px;box-shadow:var(--schatten)}
@media (prefers-color-scheme: dark){ .block{border:1px solid var(--linie)} }
.block-titel{font-weight:700;margin:0 0 10px;font-size:16px}
.block-zeile{display:flex;align-items:center;justify-content:space-between;gap:12px}
.block-zeile .block-titel{margin:0}
.block-hinweis{font-size:13.5px;color:var(--leise);margin:8px 0 0}
.ergebnis-kopf{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}
.ergebnis-kopf p{margin:0;font-size:17px}
.ergebnis-kopf b{font-family:var(--rund);font-size:26px;font-weight:800;margin-right:3px}
.wuerfel-knopf{
  appearance:none;border:0;background:var(--gelb);color:var(--gelb-tinte);border-radius:16px;min-height:52px;padding:0 18px 0 12px;
  font-family:var(--rund);font-weight:800;font-size:18px;display:inline-flex;align-items:center;gap:10px;
  box-shadow:0 3px 0 color-mix(in srgb, var(--gelb) 60%, #000)
}
.wuerfel-knopf:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb, var(--gelb) 60%, #000)}
.wuerfel-knopf:disabled{opacity:.45}
.mini-wuerfel{width:34px;height:34px;background:#fff;border-radius:9px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.mini-wuerfel i{width:6px;height:6px;border-radius:50%;background:#1C2230;place-self:center;visibility:hidden}
.mini-wuerfel i.an{visibility:visible}
.zeilen{display:flex;flex-direction:column;gap:10px}
.zeile{
  appearance:none;border:0;text-align:left;background:var(--karte);border-radius:14px;box-shadow:var(--schatten);
  display:flex;gap:12px;padding:8px;align-items:center
}
@media (prefers-color-scheme: dark){ .zeile{border:1px solid var(--linie)} }
.zeile-bild{width:72px;height:72px;border-radius:10px;flex:none}
.zeile-bild .platzhalter{font-size:30px}
.zeile-text{display:flex;flex-direction:column;gap:4px;min-width:0}
.zeile-name{font-weight:700}
.zeile-haushalte{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:13px;color:var(--leise)}
.zeile-haushalte span{display:inline-flex;align-items:center;gap:4px}

/* ---------- Haushalte ---------- */
.hh-liste{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.hh{
  appearance:none;border:0;text-align:left;background:var(--karte);border-radius:14px;box-shadow:var(--schatten);
  display:flex;align-items:center;gap:14px;padding:14px
}
@media (prefers-color-scheme: dark){ .hh{border:1px solid var(--linie)} }
.hh-figur{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb, var(--hf) 18%, var(--karte));flex:none}
.hh-text{display:flex;flex-direction:column;flex:1;min-width:0}
.hh-name{font-weight:700;font-size:17px}
.hh-info{font-size:14px;color:var(--leise)}
.marke-mein{font-size:12px;font-weight:700;color:var(--filz);background:var(--filz-hell);border-radius:999px;padding:3px 9px;white-space:nowrap}

/* ---------- Einstellungen ---------- */
.feld{display:block;margin-bottom:14px}
.feld-titel{display:block;font-weight:600;font-size:14px;color:var(--leise);margin-bottom:6px}
.eingabe{
  width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--linie);background:var(--karte);
  padding:10px 12px;font-size:16px
}
textarea.eingabe{min-height:96px;resize:vertical;line-height:1.4}
.eingabe:focus{border-color:var(--filz);outline:none}
.schluessel-reihe{display:flex;gap:8px}
.eingabe-reihe{display:flex;gap:8px}
.eingabe-reihe .eingabe{flex:1;min-width:0}
.eingabe-reihe .knopf{flex:none;padding:0 14px}
/* Suche im Internet */
.treffer-liste{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.treffer{
  appearance:none;border:1.5px solid var(--linie);background:var(--karte);border-radius:14px;text-align:left;
  display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px
}
.treffer:active{background:var(--filz-hell)}
.treffer-bild{width:56px;height:56px;border-radius:10px;background:var(--grund);flex:none;display:grid;place-items:center;overflow:hidden;color:var(--leise)}
.treffer-bild img{width:100%;height:100%;object-fit:cover}
.treffer-text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.treffer-text b{font-size:16px}
.treffer-text span{font-size:13.5px;color:var(--leise);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.treffer-quelle{font-size:12px;color:var(--leise);flex:none;align-self:flex-start;margin-top:2px}
.lade{display:flex;align-items:center;gap:12px;color:var(--leise);padding:22px 4px}
.mini-wuerfel.dreht{animation:rollen 1s linear infinite;flex:none}
@media (prefers-reduced-motion: reduce){ .mini-wuerfel.dreht{animation:none} }
.vorschau-bild{width:100%;aspect-ratio:4/3;max-height:260px;border-radius:16px;overflow:hidden;background:var(--grund);margin:14px 0 6px}
.vorschau-bild img{width:100%;height:100%;object-fit:contain}
.foto-wahl{display:flex;align-items:center;gap:10px;font-size:15px;margin:8px 0 4px}
.foto-wahl input{width:22px;height:22px;flex:none}
.quelle-text{font-size:12.5px;color:var(--leise);margin:4px 0 0;line-height:1.35}
.quelle-text a,.detail-link{color:var(--filz)}
.detail-link{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px;margin:4px 0 0;text-decoration:none}
.detail-link .ic{width:17px;height:17px}
.schluessel-reihe .eingabe{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.text-leise{color:var(--leise);font-size:14px}
.text-klein{font-size:13.5px}
.verlauf{list-style:none;margin:10px 0 0;padding:0;font-size:13.5px}
.verlauf li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--linie)}
.verlauf time{color:var(--leise);flex:none;font-variant-numeric:tabular-nums}
.verlauf .nein{color:var(--rot)}
details summary{cursor:pointer;color:var(--filz);font-weight:600;font-size:14.5px;margin-top:10px}
.fuss{text-align:center;color:var(--leise);font-size:13px;margin:18px 0 6px}
.hinweis{background:var(--filz-hell);border-radius:12px;padding:11px 13px;font-size:14px;margin:0 0 12px}
.hinweis.warn{background:color-mix(in srgb, var(--gelb) 22%, var(--karte))}

/* ---------- Sheets ---------- */
.sheet-hg{
  position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center;
  opacity:0;transition:opacity .2s
}
.sheet-hg.offen{opacity:1}
.sheet{
  background:var(--karte);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top) - 12px);overflow:auto;
  border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(40px);transition:transform .22s ease;overscroll-behavior:contain;-webkit-overflow-scrolling:touch
}
.sheet-hg.offen .sheet{transform:none}
.sheet.gross{min-height:calc(100% - env(safe-area-inset-top) - 12px)}
@media (min-width:700px){
  .sheet-hg{align-items:center;padding:24px}
  .sheet{border-radius:22px;padding-bottom:18px}
  .sheet.gross{min-height:0}
}
.sheet-kopf{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet-kopf h2{margin:0;font-family:var(--rund);font-size:22px;font-weight:800}
.sheet-fuss{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--karte);padding:12px 0 calc(4px + env(safe-area-inset-bottom));margin-top:8px;display:flex;gap:10px}
.sheet-fuss .knopf{flex:1}
@media (min-width:700px){ .sheet-fuss{bottom:-18px;padding-bottom:4px} }

/* Formular */
.foto-feld{margin-bottom:16px}
.foto-leer{
  width:100%;aspect-ratio:4/3;max-height:260px;border:2px dashed var(--linie);border-radius:16px;background:var(--grund);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--leise);font-weight:600
}
.foto-leer .ic{width:36px;height:36px;stroke-width:1.5}
.foto-vorschau{width:100%;aspect-ratio:4/3;max-height:300px;border-radius:16px}
.foto-knoepfe{display:flex;gap:8px;margin-top:8px}
.foto-knoepfe .knopf{flex:1;min-height:40px;font-size:15px}
.zwei-spalten{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--linie);border-radius:12px;overflow:hidden;background:var(--karte)}
.stepper button{appearance:none;border:0;background:var(--grund);width:46px;height:46px;font-size:24px;line-height:1;font-weight:500;color:var(--tinte)}
.stepper button:active{background:var(--filz-hell)}
.stepper output{min-width:62px;text-align:center;font-family:var(--rund);font-weight:800;font-size:19px;padding:0 4px}
.stepper.gross button{width:56px;height:56px;font-size:28px}
.stepper.gross output{min-width:76px;font-size:26px}

/* Detail */
.detail-bild{width:100%;aspect-ratio:4/3;max-height:340px;border-radius:16px;margin-bottom:14px}
.detail-bild .platzhalter{font-size:90px}
.detail-name{font-family:var(--rund);font-size:26px;font-weight:800;margin:0 0 4px;line-height:1.15}
.detail-haushalt{display:flex;align-items:center;gap:6px;color:var(--leise);margin:0 0 14px;flex-wrap:wrap}
.fakten-gross{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.fakten-gross div{background:var(--grund);border-radius:12px;padding:10px 6px;text-align:center}
.fakten-gross b{display:block;font-family:var(--rund);font-size:21px;font-weight:800}
.fakten-gross span{font-size:13px;color:var(--leise)}
.detail-text{white-space:pre-wrap;margin:12px 0}
.detail-bemerkung{background:color-mix(in srgb, var(--gelb) 18%, var(--karte));border-radius:12px;padding:10px 12px;font-size:15px;margin:12px 0}

/* Würfel-Overlay */
.wurf{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.6);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .2s}
.wurf.offen{opacity:1}
.wurf-karte{background:var(--karte);border-radius:24px;width:100%;max-width:380px;padding:22px 18px 18px;text-align:center}
.grosser-wuerfel{
  width:104px;height:104px;margin:6px auto 18px;background:#fff;border-radius:24px;display:grid;
  grid-template:repeat(3,1fr)/repeat(3,1fr);padding:16px;

}
.grosser-wuerfel i{width:17px;height:17px;border-radius:50%;background:#1C2230;place-self:center;visibility:hidden}

/* Aufklappbare Bereiche */
.klapp > summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--tinte);font-weight:700;font-size:16px;margin:0;min-height:26px}
.klapp > summary::-webkit-details-marker{display:none}

.klapp > summary small{margin-left:auto;font-weight:600;color:var(--filz);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.klapp > summary > .ic{transition:transform .2s;color:var(--leise);flex:none}
.klapp[open] > summary > .ic{transform:rotate(90deg)}
.klapp > .innen{padding-top:14px}
.klapp.block{padding-bottom:14px}

.klapp.leicht > summary{font-size:14px;color:var(--leise);font-weight:600}

.klapp.leicht.feld{margin-bottom:16px}
.punkt{width:9px;height:9px;border-radius:50%;background:#9AA3B0;display:inline-block;flex:none}
.punkt[data-k="ok"]{background:#2E9E5B}

.hh-klapp{background:var(--karte);border-radius:14px;box-shadow:var(--schatten)}

.hh-spiele button span{color:var(--leise);font-size:14px;white-space:nowrap}

.hh-knoepfe .knopf{min-height:42px;font-size:14.5px;padding:0 10px}
.block .trenner{border:0;border-top:1px solid var(--linie);margin:14px 0}
@media (prefers-reduced-motion: reduce){ .grosser-wuerfel.rollt{animation:none} .sheet,.sheet-hg,.wurf{transition:none} }

/* Toast */

  position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-20px);
  background:var(--tinte);color:var(--grund);padding:11px 16px;border-radius:12px;font-size:15px;z-index:80;

<script>
'use strict';
/* =====================================================================
   Spieleabend – Spielesammlung mehrerer Haushalte
   Daten:  daten/haushalt-<id>.json  (eine Datei pro Haushalt)
   Fotos:  bilder/<spiel>-<zeit>.jpg (eine Datei pro Foto)
   ===================================================================== */
const VERSION = 'v1.10';

const KATEGORIEN = ['Brettspiel','Kartenspiel','Würfelspiel','Strategie','Glück','Allgemeinwissen','Aktivität','Party','Kommunikation','Geschicklichkeit','Kooperativ','Rätsel & Krimi','Familie','Kinder'];
const FARBEN = [
  {n:'Rot',c:'#D64545'},{n:'Blau',c:'#2F6FDE'},{n:'Gelb',c:'#E0A100'},{n:'Grün',c:'#2E9E5B'},
  {n:'Lila',c:'#8E5BD8'},{n:'Orange',c:'#EB7A2F'},{n:'Türkis',c:'#1A9AA0'},{n:'Pink',c:'#D6589B'}
];
const DAUERN = [15,30,45,60,90,120,180];
const LS = {
  daten:'spieleabend.daten', einst:'spieleabend.einst', filter:'spieleabend.filter', runde:'spieleabend.runde',
  log:'spieleabend.verlauf', offen:'spieleabend.offen', letzter:'spieleabend.letzter', hinweis:'spieleabend.installhinweis',
  klapp:'spieleabend.aufgeklappt'
};

/* ---------- Speicher ---------- */
function lesen(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function schreiben(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ console.warn('Speichern fehlgeschlagen', e); } }

function standardOrt(){
  // Läuft die App auf <name>.github.io/<repo>/, ergeben sich Benutzer und Repo von selbst.
  const h = location.hostname, teile = location.pathname.split('/').filter(Boolean);
  if (h.endsWith('.github.io') && teile.length) return { owner: h.replace('.github.io',''), repo: decodeURIComponent(teile[0]) };
  return { owner:'1965-chris', repo:'Spieleabend' };
}

let D = lesen(LS.daten, null) || { haushalte:{}, meta:{} };
if (!D.haushalte) D.haushalte = {};
if (!D.meta) D.meta = {};
let E = Object.assign({ ...standardOrt(), branch:'main', token:'', meinHaushalt:'', einladungen:[] }, lesen(LS.einst, {}));
let F = Object.assign({ suche:'', personen:null, alter:null, dauerMax:null, kategorien:[], haushalte:[], sort:'name' }, lesen(LS.filter, {}));
F.suche = '';
let R = Object.assign({ ohne:[], personen:4, alter:null, dauerMax:null, kategorien:[] }, lesen(LS.runde, {}));
let O = Object.assign({ hoch:[], weg:[] }, lesen(LS.offen, {}));
const KL = lesen(LS.klapp, {}) || {};                   // welche Bereiche auf diesem Gerät aufgeklappt sind

function speichern(){ schreiben(LS.daten, D); }
function einstSpeichern(){ schreiben(LS.einst, E); }
function offenSpeichern(){ schreiben(LS.offen, O); }

/* ---------- Hilfen ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function neueId(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function normText(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss'); }
function nameSchluessel(s){ return normText(s).replace(/[^a-z0-9]/g,''); }
function warte(ms){ return new Promise(r => setTimeout(r, ms)); }
function zahl(v){ if (v === null || v === undefined || v === '') return null; const n = parseInt(v, 10); return Number.isFinite(n) ? n : null; }
function nachName(a, b){ return a.name.localeCompare(b.name, 'de', { sensitivity:'base', numeric:true }); }
function initiale(n){ const t = String(n || '?').trim(); return t ? [...t][0].toUpperCase() : '?'; }
function uhrzeit(ts){ return new Date(ts).toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' }); }
function datumZeit(ts){ const d = new Date(ts); const heute = new Date(); const gleich = d.toDateString() === heute.toDateString(); return (gleich ? 'heute ' : d.toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit' }) + ' ') + uhrzeit(ts); }
function pfadKod(p){ return p.split('/').map(encodeURIComponent).join('/'); }
function feldVon(form, name){ return form.elements.namedItem(name); }
/* Aufklappbarer Bereich – der Zustand (auf/zu) wird pro Gerät gemerkt */
function klappAuf(id, standard){ return Object.prototype.hasOwnProperty.call(KL, id) ? !!KL[id] : !!standard; }
function klapp(id, titel, inhalt, { standard=false, zwingend=false, klein='', kleinId='', klasse='block' } = {}){
  const offen = zwingend || klappAuf(id, standard);
  return `<details class="klapp ${klasse}" data-klapp="${id}"${offen ? ' open' : ''}><summary><span class="klapp-titel">${titel}</span><small${kleinId ? ` id="${kleinId}"` : ''}>${klein}</small>${ic('pfeil')}</summary><div class="innen">${inhalt}</div></details>`;
}
function istStandalone(){ return window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; }

const ICONS = {
  personen:'<circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.3"/><path d="M15.8 14.1c2.3.2 4.1 1.7 4.7 4.4"/>',
  kuchen:'<path d="M5 20h14v-6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z"/><path d="M5 16c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0"/><path d="M12 12V8.5"/><path d="M12 6c.8-.6.8-1.6 0-2.5-.8.9-.8 1.9 0 2.5z"/>',
  uhr:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  filter:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  kamera:'<path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/>',
  stift:'<path d="M15 5l4 4L9 19H5v-4z"/><path d="M13 7l4 4"/>',
  muell:'<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/>',
  teilen:'<path d="M12 3v12M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v7a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  pfeil:'<path d="M9 6l6 6-6 6"/>',
  wolke:'<path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 18z"/><path d="M12 11v5M9.8 13.8L12 16l2.2-2.2"/>',
  suche:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/>',
  link:'<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/>'
};
function ic(n, extra=''){ return `<svg class="ic" ${extra} viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`; }
const MEEPLE = 'M8.6 9.4h6.8c2.6.3 6.2 1.1 6.9 2.4.5.9-.1 2-1.1 2.1l-4.2.4 2.6 6.2c.4 1-.3 2.1-1.4 2.1h-2.6L12 17.8l-2.6 4.8H6.8c-1.1 0-1.8-1.1-1.4-2.1l2.6-6.2-4.2-.4c-1-.1-1.6-1.2-1.1-2.1.7-1.3 4.3-2.1 6.9-2.4z';
function figur(farbe, gr=16){ return `<svg class="figur" width="${gr}" height="${gr}" viewBox="0 0 24 24" aria-hidden="true" fill="${esc(farbe)}"><circle cx="12" cy="5.3" r="3.5"/><path d="${MEEPLE}"/></svg>`; }
const AUGEN = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function wuerfelAugen(el, n){ $$('i', el).forEach((p, i) => p.classList.toggle('an', AUGEN[n].includes(i))); }
function wuerfelHtml(klasse, n){ return `<span class="${klasse}" aria-hidden="true">${Array.from({length:9}, (_, i) => `<i class="${AUGEN[n].includes(i) ? 'an' : ''}"></i>`).join('')}</span>`; }

/* ---------- Datenform ---------- */
function spielNorm(s){
  return {
    id:String(s.id), name:String(s.name || '').trim(), bild:typeof s.bild === 'string' ? s.bild : '',
    spielerMin:zahl(s.spielerMin), spielerMax:zahl(s.spielerMax), alterAb:zahl(s.alterAb), dauer:zahl(s.dauer),
    kategorien:Array.isArray(s.kategorien) ? s.kategorien.filter(k => typeof k === 'string') : [],
    beschreibung:String(s.beschreibung || ''), bemerkung:String(s.bemerkung || ''),
    bildQuelle:String(s.bildQuelle || ''), link:/^https:\/\//.test(s.link || '') ? s.link : '',
    erstellt:zahl(s.erstellt) || 0, geaendert:zahl(s.geaendert) || 0
  };
}
function haushaltNorm(h){
  const g = {};
  const grenze = Date.now() - 400*24*3600*1000;          // Lösch-Vermerke nach gut einem Jahr vergessen
  if (h.geloescht && typeof h.geloescht === 'object') for (const [k, v] of Object.entries(h.geloescht)){ const n = zahl(v); if (n && n > grenze) g[k] = n; }
  return {
    id:String(h.id), name:String(h.name || 'Haushalt'), farbe:typeof h.farbe === 'string' ? h.farbe : FARBEN[0].c, stand:zahl(h.stand) || 0,
    spiele:(Array.isArray(h.spiele) ? h.spiele : []).filter(s => s && s.id).map(spielNorm).sort(nachName),
    geloescht:g
  };
}
function dateiForm(h){ const n = haushaltNorm(h); return { format:1, id:n.id, name:n.name, farbe:n.farbe, stand:n.stand, spiele:n.spiele, geloescht:n.geloescht }; }
function dateiName(id){ return `haushalt-${id}.json`; }
function gleich(a, b){ return JSON.stringify(dateiForm(a)) === JSON.stringify(dateiForm(b)); }

/* Zwei Stände eines Haushalts zusammenführen: pro Spiel gewinnt die neuere Änderung,
   gelöschte Spiele bleiben gelöscht, solange sie danach nicht neu bearbeitet wurden. */
function zusammenfuehren(lokal, fern){
  const A = haushaltNorm(lokal), B = haushaltNorm(fern);
  const kopf = A.stand >= B.stand ? A : B;
  const tomb = { ...B.geloescht };
  for (const [k, v] of Object.entries(A.geloescht)) tomb[k] = Math.max(tomb[k] || 0, v);
  const m = new Map();
  for (const s of B.spiele) m.set(s.id, s);
  for (const s of A.spiele){ const x = m.get(s.id); if (!x || s.geaendert > x.geaendert) m.set(s.id, s); }
  const spiele = [...m.values()].filter(s => !(tomb[s.id] && tomb[s.id] >= s.geaendert)).sort(nachName);
  return { id:A.id, name:kopf.name, farbe:kopf.farbe, stand:kopf.stand, spiele, geloescht:tomb };
}
function markiere(id, notiz){
  const m = D.meta[id] || (D.meta[id] = {});
  m.dirty = true;
  m.zaehler = (m.zaehler || 0) + 1;                       // erkennt Änderungen, die während des Hochladens passieren
  m.notizen = [...(m.notizen || []), notiz].slice(-6);
}

/* ---------- Bilder-Zwischenspeicher (IndexedDB) ---------- */
const IDB = (() => {
  let dbp = null; const notfall = new Map();
  function db(){
    if (!dbp) dbp = new Promise((res, rej) => {
      try{
        const r = indexedDB.open('spieleabend', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('bilder');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      }catch(e){ rej(e); }
    });
    return dbp;
  }
  function tx(modus, fn){
    return db().then(d => new Promise((res, rej) => {
      const t = d.transaction('bilder', modus); const st = t.objectStore('bilder'); const r = fn(st);
      t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }));
  }
  return {
    async get(k){ if (notfall.has(k)) return notfall.get(k); try{ return await tx('readonly', st => st.get(k)); }catch(e){ return undefined; } },
    async put(k, v){ notfall.set(k, v); try{ await tx('readwrite', st => st.put(v, k)); notfall.delete(k); }catch(e){} },
    async del(k){ notfall.delete(k); try{ await tx('readwrite', st => st.delete(k)); }catch(e){} }
  };
})();

const bildUrls = new Map(), bildLaeuft = new Map(), bildFehler = new Map();
async function bildLaden(pfad){
  if (!pfad) return null;
  if (bildUrls.has(pfad)) return bildUrls.get(pfad);
  if (bildLaeuft.has(pfad)) return bildLaeuft.get(pfad);
  if (bildFehler.has(pfad) && Date.now() - bildFehler.get(pfad) < 30000) return null;
  const p = (async () => {
    let blob = await IDB.get(pfad);
    if (!blob){ blob = await bildHolen(pfad); if (blob) await IDB.put(pfad, blob); }
    if (!blob){ bildFehler.set(pfad, Date.now()); return null; }
    const url = URL.createObjectURL(blob); bildUrls.set(pfad, url); return url;
  })();
  bildLaeuft.set(pfad, p);
  try{ return await p; } finally { bildLaeuft.delete(pfad); }
}
async function bildHolen(pfad){
  if (!E.owner || !E.repo) return null;
  try{
    const r = await fetch(`https://raw.githubusercontent.com/${encodeURIComponent(E.owner)}/${encodeURIComponent(E.repo)}/${encodeURIComponent(E.branch)}/${pfadKod(pfad)}`);
    if (r.ok){ const b = await r.blob(); if (b.size > 0) return new Blob([b], { type:'image/jpeg' }); }
  }catch(e){}
  try{
    const r = await fetch(api(`/contents/${pfadKod(pfad)}?ref=${encodeURIComponent(E.branch)}`), { headers:{ ...kopfzeilen(), Accept:'application/vnd.github.raw' }, cache:'no-store' });
    if (r.ok){ const b = await r.blob(); if (b.size > 0) return new Blob([b], { type:'image/jpeg' }); }
  }catch(e){}
  return null;
}
const bildBeobachter = 'IntersectionObserver' in window
  ? new IntersectionObserver(eintraege => { for (const e of eintraege) if (e.isIntersecting){ bildBeobachter.unobserve(e.target); bildEinsetzen(e.target); } }, { rootMargin:'300px' })
  : null;
async function bildEinsetzen(el){
  const p = el.dataset.bild; if (!p) return;
  const url = await bildLaden(p);
  if (!url || !el.isConnected || el.dataset.bild !== p) return;
  let img = el.querySelector('img');
  if (!img){ img = document.createElement('img'); img.alt = ''; img.decoding = 'async'; el.appendChild(img); }
  img.src = url; el.classList.add('hat-bild');
}
function bilderBeobachten(root){ $$('[data-bild]', root).forEach(el => { if (!el.dataset.bild) return; if (bildBeobachter) bildBeobachter.observe(el); else bildEinsetzen(el); }); }

async function fotoVerkleinern(datei){
  const url = URL.createObjectURL(datei);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Das Foto ließ sich nicht öffnen.')); i.src = url; });
    const max = 800; let w = img.naturalWidth, h = img.naturalHeight;
    const f = Math.min(1, max / Math.max(w, h)); w = Math.max(1, Math.round(w*f)); h = Math.max(1, Math.round(h*f));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.72));
    if (!blob) throw new Error('Das Foto ließ sich nicht verkleinern.');
    return blob;
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- GitHub ---------- */
function api(pfad){ return `https://api.github.com/repos/${encodeURIComponent(E.owner)}/${encodeURIComponent(E.repo)}${pfad}`; }
function kopfzeilen(){ const h = { Accept:'application/vnd.github+json' }; if (E.token) h.Authorization = 'Bearer ' + E.token; return h; }
async function gh(methode, pfad, body){
  for (let i = 0; i < 3; i++){
    let r;
    try{
      r = await fetch(api(pfad), {
        method:methode, cache:'no-store',
        headers: body ? { ...kopfzeilen(), 'Content-Type':'application/json' } : kopfzeilen(),
        body: body ? JSON.stringify(body) : undefined
      });
    }catch(e){
      if (i < 2 && navigator.onLine !== false){ await warte(900 * (i + 1)); continue; }
      throw new Error(navigator.onLine === false ? 'Kein Internet – die Änderungen bleiben gespeichert und gehen später raus.' : 'GitHub ist gerade nicht erreichbar.');
    }
    if (r.status >= 500 && i < 2){ await warte(900 * (i + 1)); continue; }
    return r;
  }
}
async function fehlerAus(r, was){
  let msg = ''; try{ msg = (await r.json()).message || ''; }catch(e){}
  const rest = r.headers.get('x-ratelimit-remaining');
  if (r.status === 401) return new Error('Der Schlüssel stimmt nicht oder ist abgelaufen.');
  if ((r.status === 403 || r.status === 429) && (rest === '0' || /rate limit/i.test(msg)))
    return new Error(E.token ? 'GitHub-Abrufgrenze erreicht – in einer Stunde geht es weiter.' : 'Ohne Schlüssel erlaubt GitHub nur 60 Abrufe pro Stunde. Bitte später nochmal.');
  if (r.status === 403) return new Error(`Der Schlüssel darf in diesem Repo nichts ändern${msg ? ` (GitHub: ${msg})` : ''}.`);
  if (r.status === 404) return new Error(`${was}: nicht gefunden.`);
  return new Error(`${was}: GitHub meldet ${r.status}${msg ? ' – ' + msg : ''}`);
}
function b64Bytes(bytes){ let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
function b64AusText(s){ return b64Bytes(new TextEncoder().encode(s)); }
function textAusB64(b){ const bin = atob(String(b).replace(/\s/g,'')); const by = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) by[i] = bin.charCodeAt(i); return new TextDecoder().decode(by); }
async function b64AusBlob(blob){ return b64Bytes(new Uint8Array(await blob.arrayBuffer())); }

async function repoPruefen(){
  const r = await gh('GET', '');
  if (r.status === 404) throw new Error(`Repo „${E.owner}/${E.repo}“ nicht gefunden – Benutzername und Repo in den Einstellungen prüfen.`);
  if (!r.ok) throw await fehlerAus(r, 'Repo');
  const j = await r.json();
  if (j.default_branch && j.default_branch !== E.branch){ E.branch = j.default_branch; einstSpeichern(); }
  return j;
}
async function verzeichnisLesen(){
  const r = await gh('GET', `/contents/daten?ref=${encodeURIComponent(E.branch)}`);
  const liste = new Map();
  if (r.status === 404) return liste;
  if (!r.ok) throw await fehlerAus(r, 'Datenordner');
  const j = await r.json();
  if (!Array.isArray(j)) return liste;
  for (const d of j){ const m = /^haushalt-([A-Za-z0-9_-]+)\.json$/.exec(d.name); if (m && d.type === 'file') liste.set(m[1], d.sha); }
  return liste;
}
async function dateiLesen(id){
  const r = await gh('GET', `/contents/daten/${dateiName(id)}?ref=${encodeURIComponent(E.branch)}`);
  if (r.status === 404) return { daten:null, sha:null };
  if (!r.ok) throw await fehlerAus(r, 'Haushalt lesen');
  const j = await r.json();
  let daten;
  try{ daten = JSON.parse(textAusB64(j.content)); }catch(e){ throw new Error(`Die Datei ${dateiName(id)} ist beschädigt – bitte auf GitHub prüfen.`); }
  if (!daten || typeof daten !== 'object') throw new Error(`Die Datei ${dateiName(id)} ist leer.`);
  daten.id = id;
  return { daten, sha:j.sha };
}
async function haushaltHochladen(id){
  const m = D.meta[id] || (D.meta[id] = {});
  let gemischt = false;                                     // true, wenn fremde Änderungen eingeflossen sind
  for (let versuch = 0; versuch < 4; versuch++){
    const h = D.haushalte[id]; if (!h) return gemischt;
    const stand = m.zaehler || 0, notizenBisher = (m.notizen || []).length;
    const notiz = (m.notizen || []).join(', ').slice(0, 140) || 'Spiele aktualisiert';
    const body = { message:`${h.name}: ${notiz}`, content:b64AusText(JSON.stringify(dateiForm(h), null, 1)), branch:E.branch };
    if (m.sha) body.sha = m.sha;
    const r = await gh('PUT', `/contents/daten/${dateiName(id)}`, body);
    if (r.ok){
      const j = await r.json();
      m.sha = j.content && j.content.sha; m.aufServer = true;
      m.dirty = (m.zaehler || 0) !== stand;                  // inzwischen neu geändert? dann gleich nochmal
      m.notizen = (m.notizen || []).slice(notizenBisher);
      speichern();
      if (m.dirty) continue;
      return gemischt;
    }
    if (r.status === 409 || r.status === 422){
      // Jemand war schneller: frischen Stand holen, zusammenführen, nochmal versuchen
      const fern = await dateiLesen(id);
      if (fern.daten){ D.haushalte[id] = zusammenfuehren(D.haushalte[id], fern.daten); m.sha = fern.sha; gemischt = true; }
      else m.sha = null;
      speichern(); continue;
    }
    throw await fehlerAus(r, 'Speichern');
  }
  throw new Error('Speichern bei GitHub hat nach mehreren Versuchen nicht geklappt.');
}
async function fotosHochladen(){
  let n = 0;
  for (const pfad of [...O.hoch]){
    const blob = await IDB.get(pfad);
    if (!blob){ O.hoch = O.hoch.filter(p => p !== pfad); offenSpeichern(); continue; }
    const r = await gh('PUT', `/contents/${pfadKod(pfad)}`, { message:`Foto ${pfad.split('/').pop()}`, content:await b64AusBlob(blob), branch:E.branch });
    if (r.ok || r.status === 422){ O.hoch = O.hoch.filter(p => p !== pfad); offenSpeichern(); n++; }
    else throw await fehlerAus(r, 'Foto hochladen');
  }
  return n;
}
async function fotosAufraeumen(){
  const benutzt = new Set(); for (const h of Object.values(D.haushalte)) for (const s of h.spiele) if (s.bild) benutzt.add(s.bild);
  for (const pfad of [...O.weg]){
    if (benutzt.has(pfad) || O.hoch.includes(pfad)){ O.weg = O.weg.filter(p => p !== pfad); offenSpeichern(); continue; }
    try{
      const r = await gh('GET', `/contents/${pfadKod(pfad)}?ref=${encodeURIComponent(E.branch)}`);
      if (r.ok){
        const j = await r.json();
        const d = await gh('DELETE', `/contents/${pfadKod(pfad)}`, { message:`Altes Foto entfernt`, sha:j.sha, branch:E.branch });
        if (!d.ok && d.status !== 404) continue;
      } else if (r.status !== 404) continue;
      O.weg = O.weg.filter(p => p !== pfad); offenSpeichern(); IDB.del(pfad);
    }catch(e){ /* beim nächsten Abgleich wieder versuchen */ }
  }
}

/* ---------- Abgleich ---------- */
const S = { laeuft:false, nochmal:false, fehler:'', letzter:lesen(LS.letzter, 0), timer:null };
function protokoll(text, ok=true){ const l = lesen(LS.log, []); l.unshift({ z:Date.now(), t:text, ok }); schreiben(LS.log, l.slice(0, 20)); }
function syncBald(){ clearTimeout(S.timer); S.timer = setTimeout(() => sync('Änderung'), 1200); statusZeigen(); }

async function sync(anlass){
  if (!E.owner || !E.repo){ statusZeigen(); return; }
  if (S.laeuft){ S.nochmal = true; return; }
  S.laeuft = true; statusZeigen();
  const st = { geholt:0, hoch:0, fotos:0, weg:0 };
  let neuZeichnen = false;
  try{
    await repoPruefen();

    // 1) Stand von GitHub holen – erst danach wird irgendetwas hochgeladen
    const liste = await verzeichnisLesen();
    const bekannt = Object.keys(D.haushalte).filter(id => (D.meta[id] || {}).aufServer);
    for (const [id, sha] of liste){
      const m = D.meta[id] || (D.meta[id] = {});
      if (m.sha === sha && D.haushalte[id]){ m.aufServer = true; continue; }
      const fern = await dateiLesen(id);
      if (!fern.daten) continue;
      const lokal = D.haushalte[id];
      if (lokal && m.dirty){
        D.haushalte[id] = zusammenfuehren(lokal, fern.daten);
        if (gleich(D.haushalte[id], fern.daten)) m.dirty = false;
      } else {
        D.haushalte[id] = haushaltNorm(fern.daten);
      }
      m.sha = fern.sha; m.aufServer = true; st.geholt++; neuZeichnen = true;
    }
    // 2) Auf GitHub gelöschte Haushalte auch hier entfernen (mit Sicherung gegen leere Antworten)
    if (!(liste.size === 0 && bekannt.length > 1)){
      for (const id of Object.keys(D.haushalte)){
        const m = D.meta[id] || {};
        if (liste.has(id) || !m.aufServer) continue;
        if (m.dirty){ m.sha = null; continue; }
        delete D.haushalte[id]; delete D.meta[id]; st.weg++; neuZeichnen = true;
        if (E.meinHaushalt === id){ E.meinHaushalt = ''; einstSpeichern(); }
      }
    }
    speichern();
    if (neuZeichnen) renderAlles();

    // 3) Eigene Änderungen hochladen – Fotos zuerst, damit die Spieldaten nie auf fehlende Fotos zeigen
    if (E.token){
      st.fotos = await fotosHochladen();
      let gemischt = false;
      for (const id of Object.keys(D.haushalte)) if ((D.meta[id] || {}).dirty){ if (await haushaltHochladen(id)) gemischt = true; st.hoch++; }
      if (gemischt) renderAlles();
      await fotosAufraeumen();
    }

    S.fehler = ''; S.letzter = Date.now(); schreiben(LS.letzter, S.letzter);
    const teile = [];
    if (st.geholt) teile.push(`${st.geholt} Haushalt${st.geholt === 1 ? '' : 'e'} aktualisiert`);
    if (st.hoch) teile.push(`${st.hoch} hochgeladen`);
    if (st.fotos) teile.push(`${st.fotos} Foto${st.fotos === 1 ? '' : 's'} hochgeladen`);
    if (st.weg) teile.push(`${st.weg} Haushalt${st.weg === 1 ? '' : 'e'} entfernt`);
    if (teile.length || anlass === 'Start' || anlass === 'von Hand') protokoll(`${anlass}: ${teile.length ? teile.join(', ') : 'alles aktuell'}`);
  }catch(e){
    S.fehler = e.message || String(e);
    protokoll(`${anlass}: ${S.fehler}`, false);
    if (anlass === 'von Hand') toast(S.fehler, 'fehler');
  }finally{
    S.laeuft = false; statusZeigen();
    if ($('#seite-einstellungen').classList.contains('aktiv')) renderEinstellungen();
    if (S.nochmal){ S.nochmal = false; setTimeout(() => sync('Nachtrag'), 300); }
    else hausFrage();
  }
}
function syncZustand(){
  if (!E.owner || !E.repo) return { k:'aus', t:'Nicht verbunden' };
  if (S.laeuft) return { k:'laeuft', t:'Gleicht ab …' };
  if (navigator.onLine === false) return { k:'aus', t:'Offline' };
  const offen = Object.values(D.meta).some(m => m.dirty) || O.hoch.length > 0;
  if (offen && !E.token) return { k:'aus', t:'Nur auf diesem Gerät' };
  if (S.fehler) return { k:'fehler', t:'Nicht abgeglichen' };
  if (offen) return { k:'laeuft', t:'Wartet …' };
  if (!S.letzter) return { k:'aus', t:'Noch nicht abgeglichen' };
  return { k:'ok', t:'Abgeglichen' };
}
function statusZeigen(){
  const z = syncZustand(), b = $('#sync-knopf');
  b.dataset.k = z.k; b.querySelector('span').textContent = z.t;
  b.title = S.fehler || (S.letzter ? 'Letzter Abgleich ' + datumZeit(S.letzter) : '');

let offeneSheets = 0;
function sheet(html, { klasse='', beimSchliessen=null } = {}){
  const hg = document.createElement('div'); hg.className = 'sheet-hg';
  hg.innerHTML = `<div class="sheet ${klasse}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(hg); offeneSheets++; document.body.classList.add('modal-offen');
  requestAnimationFrame(() => requestAnimationFrame(() => hg.classList.add('offen')));
  const s = hg.firstElementChild; let zu = false;
  s.schliessen = () => {
    if (zu) return; zu = true; hg.classList.remove('offen');
    setTimeout(() => { hg.remove(); offeneSheets--; if (!offeneSheets) document.body.classList.remove('modal-offen'); }, 220);
    if (beimSchliessen) beimSchliessen();
  };
  hg.addEventListener('click', e => { if (e.target === hg) s.schliessen(); });
  $$('[data-zu]', s).forEach(b => b.addEventListener('click', () => s.schliessen()));

}

/* ---------- Daten für die Ansicht ---------- */
function haushaltListe(){
  return Object.values(D.haushalte).sort((a, b) => (a.id === E.meinHaushalt ? -1 : b.id === E.meinHaushalt ? 1 : 0) || a.name.localeCompare(b.name, 'de'));
}
function alleSpiele(){
  const m = new Map();
  for (const h of Object.values(D.haushalte)) for (const s of h.spiele){ const x = m.get(s.id); if (!x || s.geaendert > x.geaendert) m.set(s.id, { ...s, hid:h.id }); }
  return [...m.values()];
}
function spielFinden(id){ return alleSpiele().find(s => s.id === id); }
function passt(s, f){
  if (f.personen != null){ const mn = s.spielerMin ?? 1, mx = s.spielerMax ?? mn; if (f.personen < mn || f.personen > mx) return false; }
  if (f.alter != null && s.alterAb != null && s.alterAb > f.alter) return false;
  if (f.dauerMax != null && s.dauer != null && s.dauer > f.dauerMax) return false;
  if (f.kategorien && f.kategorien.length && !s.kategorien.some(k => f.kategorien.includes(k))) return false;
  if (f.haushalte && f.haushalte.length && !f.haushalte.includes(s.hid)) return false;
  if (f.ohne && f.ohne.includes(s.hid)) return false;
  if (f.suche){ const q = normText(f.suche).trim(); if (q && !normText([s.name, s.beschreibung, s.bemerkung, s.kategorien.join(' ')].join(' ')).includes(q)) return false; }
  return true;
}
function gruppieren(liste){
  const m = new Map();
  for (const s of liste){ const k = nameSchluessel(s.name) || s.id; if (!m.has(k)) m.set(k, []); m.get(k).push(s); }
  return [...m.values()].map(kopien => { kopien.sort((a, b) => (b.bild ? 1 : 0) - (a.bild ? 1 : 0)); return { haupt:kopien[0], kopien }; })
    .sort((a, b) => nachName(a.haupt, b.haupt));
}
function spielerText(s){
  const mn = s.spielerMin, mx = s.spielerMax;
  if (mn == null && mx == null) return '?';
  if (mx == null || mx === mn) return `${mn ?? mx}`;
  if (mn == null) return `bis ${mx}`;
  return `${mn}–${mx}`;
}
function dauerText(d){ if (d >= 180) return '3 Std.+'; if (d >= 60 && d % 60 === 0) return `${d/60} Std.`; return `${d} Min.`; }
function faktenHtml(s){

function spielLoeschen(sp){
  const h = D.haushalte[sp.hid]; if (!h) return;
  h.spiele = h.spiele.filter(x => x.id !== sp.id);
  h.geloescht[sp.id] = Date.now();
  if (sp.bild) fotoWeg(sp.bild);
  markiere(h.id, `${sp.name} gelöscht`);
  speichern(); renderAlles(); syncBald(); toast(`„${sp.name}“ gelöscht`);
}
function fotoWeg(pfad){
  if (O.hoch.includes(pfad)){ O.hoch = O.hoch.filter(p => p !== pfad); IDB.del(pfad); }
  else if (!O.weg.includes(pfad)) O.weg.push(pfad);
  offenSpeichern();
}

/* ---------- Spieldaten im Internet nachschlagen (deutsche Wikipedia + Wikidata) ----------
   Beide Dienste erlauben Abfragen direkt aus dem Browser (origin=*) und brauchen keine Anmeldung. */
const WP_API = 'https://de.wikipedia.org/w/api.php';
const WD_API = 'https://www.wikidata.org/w/api.php';
function wikiUrl(basis, params){
  const u = new URL(basis);
  for (const [k, v] of Object.entries({ format:'json', formatversion:'2', origin:'*', ...params })) u.searchParams.set(k, v);
  return u.toString();
}
async function wikiJson(url){
  let r;
  try{ r = await fetch(url); }catch(e){ throw new Error('Keine Verbindung zu Wikipedia – bitte später nochmal versuchen.'); }
  if (!r.ok) throw new Error(`Wikipedia antwortet gerade nicht (${r.status}).`);
  const j = await r.json();
  if (j && j.error) throw new Error(`Wikipedia meldet: ${j.error.info || j.error.code}`);
  return j;
}
function anzeigeName(titel){ return String(titel || '').replace(/\s*\((?:[A-Za-zÄÖÜäöüß-]*spiel|Spiel)\)\s*$/i, '').trim(); }

async function kandidatenSuchen(q){
  const [wp, wd] = await Promise.allSettled([wpKandidaten(q), wdKandidaten(q)]);
  if (wp.status === 'rejected' && wd.status === 'rejected') throw wp.reason;
  const liste = [], qids = new Set(), titel = new Set();
  if (wp.status === 'fulfilled') for (const k of wp.value){ liste.push(k); if (k.qid) qids.add(k.qid); titel.add(k.titel); }
  if (wd.status === 'fulfilled') for (const k of wd.value) if (!qids.has(k.qid) && !(k.titel && titel.has(k.titel))) liste.push(k);
  return liste.slice(0, 12);
}
async function wpKandidaten(q){
  // Nur Artikel mit der „Infobox Spiel“ – das sind Brett-, Karten- und Gesellschaftsspiele
  const j = await wikiJson(wikiUrl(WP_API, {
    action:'query', generator:'search', gsrsearch:`${q} hastemplate:"Infobox Spiel"`, gsrnamespace:'0', gsrlimit:'8',
    prop:'pageimages|pageprops|description', piprop:'thumbnail', pithumbsize:'160', pilimit:'8', ppprop:'wikibase_item'
  }));
  const seiten = (j.query && j.query.pages) || [];
  return seiten.slice().sort((a, b) => (a.index || 0) - (b.index || 0)).map(p => ({
    quelle:'Wikipedia', titel:p.title, name:anzeigeName(p.title), beschreibung:p.description || '',
    vorschau:(p.thumbnail && p.thumbnail.source) || '', qid:(p.pageprops && p.pageprops.wikibase_item) || ''
  }));
}
async function wdKandidaten(q){
  const s = await wikiJson(wikiUrl(WD_API, { action:'wbsearchentities', search:q, language:'de', uselang:'de', type:'item', limit:'12' }));
  const ids = (s.search || []).map(x => x.id).filter(Boolean);
  if (!ids.length) return [];
  const e = await wikiJson(wikiUrl(WD_API, { action:'wbgetentities', ids:ids.join('|'), props:'claims|labels|descriptions|sitelinks', languages:'de|en', sitefilter:'dewiki' }));
  const out = [];
  for (const id of ids){
    const ent = e.entities && e.entities[id]; if (!ent || ent.missing !== undefined) continue;
    const c = ent.claims || {}, beschr = wdText(ent.descriptions);
    const istSpiel = ['P1872','P1873','P2339','P3528'].some(p => c[p]) || /\b(?:brett|karten|würfel|gesellschafts|party|lege|familien|kinder|kommunikations|quiz)?spiel\b|board game|card game|dice game/i.test(beschr);
    if (!istSpiel) continue;
    const dewiki = ent.sitelinks && ent.sitelinks.dewiki ? ent.sitelinks.dewiki.title : '';
    out.push({ quelle:'Wikidata', qid:id, titel:dewiki, name:wdText(ent.labels) || anzeigeName(dewiki) || id, beschreibung:beschr, vorschau:'' });
  }
  return out;
}
function wdText(m){ if (!m) return ''; return (m.de && m.de.value) || (m.en && m.en.value) || ''; }

/* Infobox „Spiel“ aus dem Wikitext lesen: | Mitspieler = … | Dauer = … | Alter = … */
function infoboxLesen(wt){
  wt = String(wt || '');
  const m = /\{\{\s*Infobox[ _]Spiel\s*(?=\||\n|\}\})/i.exec(wt); if (!m) return {};
  let tiefe = 1, eck = 0, akt = ''; const teile = [];
  for (let i = m.index + 2; i < wt.length; i++){
    const zwei = wt.substr(i, 2);
    if (zwei === '{{'){ tiefe++; akt += zwei; i++; continue; }
    if (zwei === '}}'){ tiefe--; if (tiefe === 0) break; akt += zwei; i++; continue; }
    if (zwei === '[['){ eck++; akt += zwei; i++; continue; }
    if (zwei === ']]'){ eck = Math.max(0, eck - 1); akt += zwei; i++; continue; }
    if (wt[i] === '|' && tiefe === 1 && eck === 0){ teile.push(akt); akt = ''; continue; }
    akt += wt[i];
  }
  teile.push(akt);
  const out = {};
  for (const t of teile.slice(1)){ const p = t.indexOf('='); if (p < 0) continue; const k = t.slice(0, p).trim(); const v = t.slice(p + 1).trim(); if (k && v) out[k] = v; }
  return out;
}
/* Wiki-Auszeichnungen entfernen: [[Link|Text]] → Text, <br> → Zeilenumbruch, Vorlagen und Fußnoten weg */
function wikiText(v){
  let s = String(v || '');
  s = s.replace(/<!--[\s\S]*?-->/g, '').replace(/<ref[^>]*\/>/gi, '').replace(/<ref[^>]*>[\s\S]*?<\/ref>/gi, '');
  s = s.replace(/<br\s*\/?>/gi, '\n');
  for (let n = 0; n < 6 && /\{\{/.test(s); n++){
    s = s.replace(/\{\{([^{}]*)\}\}/g, (_, inhalt) => {
      const t = inhalt.split('|'), name = t[0].trim().toLowerCase();
      if (/^(nowrap|nobr|lang|k|kursiv|hs|nts)$/.test(name)) return t[t.length - 1] || '';
      if (name === 'bruch' && t.length >= 3) return `${t[1]}/${t[2]}`;
      return '';
    });
  }
  s = s.replace(/\[\[(?:[^|\]]*\|)?([^\]]*)\]\]/g, '$1').replace(/\[https?:\/\/\S+\s+([^\]]*)\]/g, '$1');
  s = s.replace(/'{2,}/g, '').replace(/<[^>]+>/g, '');
  s = s.replace(/&nbsp;/g, ' ').replace(/&ndash;|&#8211;/g, '–').replace(/&amp;/g, '&');
  return s.split('\n').map(z => z.replace(/[ \t]+/g, ' ').trim()).filter(Boolean).join('\n');
}
function hauptTeil(s){
  // Der erste Teil vor Klammern oder Zeilenumbruch ist die eigentliche Angabe („3 bis 4 (2 bis 6 mit Erweiterung)“)
  const erster = s.split(/\n|\(/)[0];
  return /\d/.test(erster) ? erster : s;
}
function spielerLesen(v){
  const s = hauptTeil(wikiText(v)).toLowerCase();
  const z = (s.match(/\d+/g) || []).map(Number).filter(n => n > 0 && n < 100);
  if (!z.length) return null;
  if (z.length >= 2) return { min:Math.min(z[0], z[1]), max:Math.max(z[0], z[1]) };
  if (/\bab\b|mindestens|oder mehr|und mehr|\+|beliebig|unbegrenzt/.test(s)) return { min:z[0], max:null };
  if (/^\s*(bis|max)/.test(s)) return { min:null, max:z[0] };
  return { min:z[0], max:z[0] };
}
function alterLesen(v){ const m = hauptTeil(wikiText(v)).match(/\d+/); const n = m ? +m[0] : null; return n && n < 30 ? n : null; }
function dauerLesen(v){
  const s = hauptTeil(wikiText(v)).toLowerCase().replace(/(\d),(\d)/g, '$1.$2');
  const z = (s.match(/\d+(?:\.\d+)?/g) || []).map(Number).filter(n => n > 0);
  if (!z.length) return null;
  let wert = Math.max(...z.slice(0, 2));
  if (/stunde|std|\bh\b/.test(s) && !/min/.test(s)) wert *= 60;
  return wert >= 1 && wert <= 1440 ? Math.round(wert) : null;
}
function dauerRaster(min){ return min == null ? null : DAUERN.reduce((a, b) => Math.abs(b - min) <= Math.abs(a - min) ? b : a); }
/* Spielart aus Texten wie „Brettspiel“, „kooperatives Kartenspiel“, „Partyspiel“ ableiten */
const ART_REGELN = [
  [/brettspiel|legespiel|laufspiel|wettlaufspiel/, 'Brettspiel'], [/kartenspiel|stichspiel|ablegespiel|sammelkarten/, 'Kartenspiel'],
  [/wurfelspiel|dice game/, 'Würfelspiel'], [/strategiespiel|strategisch|wirtschaftsspiel|aufbauspiel|eurogame|worker.?placement/, 'Strategie'],
  [/glucksspiel/, 'Glück'], [/quiz|wissensspiel/, 'Allgemeinwissen'], [/pantomim|zeichenspiel|scharade/, 'Aktivität'],
  [/partyspiel|party game/, 'Party'], [/kommunikationsspiel|wortspiel|worterspiel|assoziationsspiel|ratespiel/, 'Kommunikation'],
  [/geschicklichkeit|stapelspiel/, 'Geschicklichkeit'], [/kooperativ/, 'Kooperativ'],
  [/krimi|detektiv|deduktion|ratsel|escape|denkspiel|logikspiel/, 'Rätsel & Krimi'], [/familienspiel/, 'Familie'], [/kinderspiel/, 'Kinder']
];
function artenAus(texte){
  const t = normText(texte.filter(Boolean).join(' | '));
  return ART_REGELN.filter(([re]) => re.test(t)).map(([, k]) => k);
}
function saetze(text, n){
  let t = String(text || '').replace(/\s+/g, ' ').trim();
  if (!t) return '';
  t = t.replace(/\b([a-zäöü])\.\s?([a-zA-ZÄÖÜäöü])\./g, '$1§ $2§');            // z. B., d. h., u. a.
  t = t.replace(/\b(bzw|ca|etc|vgl|Nr|bspw|ggf|usw|inkl|evtl|Mio|Mrd|Dr|St|Chr|Jh|Min|Std)\.(?=\s|$)/g, '$1§');
  const teile = t.match(/[^.!?]+[.!?]+["»“”)]?(\s|$)/g) || [t];
  return teile.slice(0, n).join('').replace(/§/g, '.').trim();
}
function kurzBeschreibung(extract){
  const t = String(extract || '');
  const intro = t.split(/\n==(?!=)/)[0].trim();
  const m = /\n==\s*(Spielablauf|Spielprinzip|Spielweise|Spielidee|Spielverlauf|Ablauf|Spielregeln|Regeln|Spielziel|Spielmechanik|Spielbeschreibung|Spielmaterial und Spielablauf)\s*==\s*\n([\s\S]*?)(?=\n==(?!=)|$)/i.exec(t);
  const satz1 = saetze(intro, 1);
  let rest = m ? saetze(m[2].replace(/^=+.*=+\s*$/gm, ' '), 2) : saetze(intro, 3).slice(satz1.length).trim();
  return `${satz1}${rest ? ' ' + rest : ''}`.trim();
}
function herkunftSatz(ib){
  const ersteZeile = v => wikiText(v).split('\n')[0].trim();
  const autor = wikiText(ib.Autor).split('\n').map(x => x.trim()).filter(Boolean).slice(0, 3).join(', ');
  const verlag = ersteZeile(ib.Verlag), jahrM = wikiText(ib.Erscheinungsjahr).match(/\b(1[89]|20)\d\d\b/), jahr = jahrM ? jahrM[0] : '';
  if (!autor && !verlag && !jahr) return '';
  let s = autor ? `Von ${autor}` : 'Erschienen';
  if (jahr) s += autor ? `, erschienen ${jahr}` : ` ${jahr}`;
  if (verlag) s += ` bei ${verlag}`;
  return s.length > 160 ? '' : s + '.';
}
function wdMenge(claims, p){
  const liste = (claims && claims[p]) || [];
  const st = liste.find(x => x.rank === 'preferred' && x.mainsnak && x.mainsnak.datavalue) || liste.find(x => x.rank !== 'deprecated' && x.mainsnak && x.mainsnak.datavalue);
  if (!st) return null;
  const v = st.mainsnak.datavalue.value;
  if (v && v.amount != null) return { zahl:parseFloat(v.amount), einheit:String(v.unit || '').split('/').pop() };
  return { wert:v };
}
function wdIds(claims, p){ return ((claims && claims[p]) || []).map(x => x.mainsnak && x.mainsnak.datavalue && x.mainsnak.datavalue.value && x.mainsnak.datavalue.value.id).filter(Boolean); }

/* Alle Angaben zu einem gewählten Treffer zusammentragen */
async function spielDetailsHolen(k){
  const d = { name:k.name, spielerMin:null, spielerMax:null, alterAb:null, dauer:null, kategorien:[], beschreibung:'', link:'', bild:null, quellen:[] };
  const artTexte = [];
  let qid = k.qid, bildDatei = '';
  if (k.titel){
    const j = await wikiJson(wikiUrl(WP_API, {
      action:'query', titles:k.titel, redirects:'1', prop:'revisions|extracts|pageprops|pageimages',
      rvprop:'content', rvslots:'main', rvsection:'0', explaintext:'1', exsectionformat:'wiki', ppprop:'wikibase_item', piprop:'name'
    }));
    const p = j.query && j.query.pages && j.query.pages[0];
    if (p && !p.missing){
      d.quellen.push('Wikipedia');
      d.link = `https://de.wikipedia.org/wiki/${encodeURIComponent(p.title.replace(/ /g, '_'))}`;
      qid = qid || (p.pageprops && p.pageprops.wikibase_item) || '';
      const rev = p.revisions && p.revisions[0];
      const wt = rev ? (rev.slots && rev.slots.main ? rev.slots.main.content : rev.content) : '';
      const ib = infoboxLesen(wt);
      const sp = spielerLesen(ib.Mitspieler || ib.Spieler || ib.Spieleranzahl);
      if (sp){ d.spielerMin = sp.min; d.spielerMax = sp.max; }
      d.alterAb = alterLesen(ib.Alter || ib.Altersempfehlung);
      d.dauer = dauerLesen(ib.Dauer || ib.Spieldauer);
      artTexte.push(wikiText(ib.Art));
      const kurz = kurzBeschreibung(p.extract || '');
      artTexte.push(saetze((p.extract || '').split(/\n==/)[0], 1));
      d.beschreibung = [kurz, herkunftSatz(ib)].filter(Boolean).join('\n').slice(0, 600);
      bildDatei = wikiText(ib.Bild).replace(/^(Datei|File|Bild|Image):/i, '').split('\n')[0].trim() || p.pageimage || '';
    }
  }
  if (qid){
    try{
      const e = await wikiJson(wikiUrl(WD_API, { action:'wbgetentities', ids:qid, props:'claims|descriptions', languages:'de' }));
      const ent = e.entities && e.entities[qid];
      const c = (ent && ent.claims) || {};
      if (ent) d.quellen.push('Wikidata');
      const mn = wdMenge(c, 'P1872'), mx = wdMenge(c, 'P1873'), al = wdMenge(c, 'P2899'), du = wdMenge(c, 'P2047');
      if (d.spielerMin == null && d.spielerMax == null){ d.spielerMin = mn ? Math.round(mn.zahl) : null; d.spielerMax = mx ? Math.round(mx.zahl) : null; }
      else { if (d.spielerMin == null && mn) d.spielerMin = Math.round(mn.zahl); if (d.spielerMax == null && mx) d.spielerMax = Math.round(mx.zahl); }
      if (d.alterAb == null && al && al.zahl > 0 && al.zahl < 30) d.alterAb = Math.round(al.zahl);
      if (d.dauer == null && du && du.zahl > 0){ const f = { Q7727:1, Q25235:60, Q11574:1/60 }[du.einheit]; if (f) d.dauer = Math.round(du.zahl * f); }
      if (!bildDatei){ const b = wdMenge(c, 'P18'); if (b && typeof b.wert === 'string') bildDatei = b.wert; }
      if (!d.beschreibung && ent) d.beschreibung = wdText(ent.descriptions);
      if (ent) artTexte.push(wdText(ent.descriptions));
      if (!d.link) d.link = `https://www.wikidata.org/wiki/${qid}`;
      const artIds = [...wdIds(c, 'P31'), ...wdIds(c, 'P136')].slice(0, 20);
      if (artIds.length){
        const l = await wikiJson(wikiUrl(WD_API, { action:'wbgetentities', ids:artIds.join('|'), props:'labels', languages:'de' }));
        for (const id of artIds){ const x = l.entities && l.entities[id]; if (x) artTexte.push(wdText(x.labels)); }
      }
    }catch(e){ if (!d.quellen.length) throw e; }
  }
  if (d.spielerMin != null && d.spielerMax != null && d.spielerMin > d.spielerMax) [d.spielerMin, d.spielerMax] = [d.spielerMax, d.spielerMin];
  d.kategorien = artenAus(artTexte);
  if (bildDatei){
    try{
      const j = await wikiJson(wikiUrl(WP_API, { action:'query', titles:'Datei:' + bildDatei, prop:'imageinfo', iiprop:'url|extmetadata', iiurlwidth:'800', iiextmetadatafilter:'Artist|LicenseShortName' }));
      const p = j.query && j.query.pages && j.query.pages[0];
      const ii = p && p.imageinfo && p.imageinfo[0];
      if (ii && (ii.thumburl || ii.url)){
        const meta = ii.extmetadata || {};
        const urheber = wikiText((meta.Artist && meta.Artist.value) || '').replace(/\n/g, ' ').slice(0, 80);
        const lizenz = (meta.LicenseShortName && meta.LicenseShortName.value) || '';
        d.bild = { url:ii.thumburl || ii.url, quelle:['Foto: ' + (urheber || 'unbekannt'), lizenz, 'Wikimedia Commons'].filter(Boolean).join(', ') };
      }
    }catch(e){ /* ohne Foto weitermachen */ }
  }
  return d;
}
async function fotoAusNetz(url){
  let r;
  try{ r = await fetch(url); }catch(e){ throw new Error('Das Foto ließ sich nicht laden.'); }
  if (!r.ok) throw new Error('Das Foto ließ sich nicht laden.');
  return fotoVerkleinern(await r.blob());
}

    if (sp && sp.hid !== hid && D.haushalte[sp.hid]){
      const alt = D.haushalte[sp.hid];
      alt.spiele = alt.spiele.filter(x => x.id !== sp.id); alt.geloescht[sp.id] = spiel.geaendert - 1;
      markiere(alt.id, `${name} abgegeben`);
    }
    const h = D.haushalte[hid];
    h.spiele = [...h.spiele.filter(x => x.id !== spiel.id), spiel].sort(nachName);
    delete h.geloescht[spiel.id];
    markiere(hid, neu ? `${name} eingetragen` : `${name} geändert`);
    speichern(); s.schliessen(); renderAlles(); syncBald();
    toast(neu ? `„${name}“ eingetragen` : 'Gespeichert');

}

let letzterWurf = null;
function wuerfeln(){
  const gruppen = rundeTreffer(); if (!gruppen.length) return;
  let auswahl = gruppen.length > 1 ? gruppen.filter(g => g.haupt.id !== letzterWurf) : gruppen;
  const ziel = auswahl[Math.floor(Math.random() * auswahl.length)]; letzterWurf = ziel.haupt.id;
  const ov = document.createElement('div'); ov.className = 'wurf';
  ov.innerHTML = `<div class="wurf-karte" role="dialog" aria-modal="true" aria-label="Würfeln">${wuerfelHtml('grosser-wuerfel rollt', 3)}<div class="wurf-name" aria-live="polite"></div><div class="wurf-ergebnis"></div></div>`;
  document.body.appendChild(ov); requestAnimationFrame(() => ov.classList.add('offen'));
  const w = $('.grosser-wuerfel', ov), nameEl = $('.wurf-name', ov), erg = $('.wurf-ergebnis', ov);
  const zu = () => { ov.classList.remove('offen'); setTimeout(() => ov.remove(), 200); };
  ov.addEventListener('click', e => { if (e.target === ov) zu(); });
  const ruhig = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let zeit = 0, schritt = 55; const dauer = ruhig ? 0 : 1600;
  function tick(){
    const g = gruppen[Math.floor(Math.random() * gruppen.length)];
    nameEl.textContent = g.haupt.name; wuerfelAugen(w, 1 + Math.floor(Math.random() * 6));
    zeit += schritt; schritt *= 1.13;
    if (zeit < dauer) setTimeout(tick, schritt); else fertig();
  }
  function fertig(){
    w.classList.remove('rollt'); wuerfelAugen(w, 6);
    const s = ziel.haupt, farbe = farbeVon(s.hid);
    w.remove(); nameEl.remove();
    erg.innerHTML = `<div class="detail-bild" style="--hf:${esc(farbe)}"${s.bild ? ` data-bild="${esc(s.bild)}"` : ''}><span class="platzhalter">${esc(initiale(s.name))}</span></div>
      <h2 class="detail-name">${esc(s.name)}</h2>${faktenHtml(s)}
      <div class="zeile-haushalte">${ziel.kopien.map(k => `<span>${figur(farbeVon(k.hid), 14)}steht bei ${esc((D.haushalte[k.hid] || {}).name || '')}</span>`).join('')}</div>
      <div class="wurf-knoepfe"><button class="knopf" type="button" data-passt>Das spielen wir!</button><button class="knopf zweit" type="button" data-nochmal>Nochmal würfeln</button></div>`;
    bilderBeobachten(erg);
    $('[data-nochmal]', erg).addEventListener('click', () => { zu(); setTimeout(wuerfeln, 220); });
    $('[data-passt]', erg).addEventListener('click', zu);
  }
  tick();
}

function haushaltAktion(was, id){
  const h = D.haushalte[id]; if (!h) return;
  if (was === 'spiele'){ filterZuruecksetzen(); F.haushalte = [id]; schreiben(LS.filter, F); seiteZeigen('spiele'); }
  if (was === 'mein'){ E.meinHaushalt = id; einstSpeichern(); renderAlles(); toast(`„${h.name}“ ist jetzt dein Haushalt`); }
  if (was === 'bearbeiten') haushaltFormular(h);
  if (was === 'loeschen') haushaltLoeschen(id);
}
function haushaltFormular(h, danach){
  const neu = !h;
  const benutzt = Object.values(D.haushalte).map(x => x.farbe);
  const farbe0 = h ? h.farbe : (FARBEN.find(f => !benutzt.includes(f.c)) || FARBEN[0]).c;
  const s = sheet(`<form novalidate>
    <div class="sheet-kopf"><h2>${neu ? 'Neuer Haushalt' : 'Haushalt ändern'}</h2><button class="knopf-rund" type="button" data-zu aria-label="Schließen">${ic('x')}</button></div>
    <label class="feld"><span class="feld-titel">Name</span><input class="eingabe" name="name" value="${esc(h ? h.name : '')}" placeholder="z. B. Familie Mättig" maxlength="40" autocomplete="off" autocapitalize="words"></label>
    <div class="feld"><span class="feld-titel">Farbe der Spielfigur</span>
      <div class="chips" data-gruppe="farbe" data-mehrfach="0" data-pflicht="1">${FARBEN.map(f => `<button type="button" class="chip figur-chip" style="--hf:${f.c}" data-wert="${f.c}" aria-pressed="${f.c === farbe0}">${figur(f.c, 18)}${f.n}</button>`).join('')}</div></div>
    ${neu ? `<label class="feld" style="display:flex;gap:10px;align-items:center"><input type="checkbox" name="mein" ${E.meinHaushalt && D.haushalte[E.meinHaushalt] ? '' : 'checked'} style="width:22px;height:22px">Das ist mein Haushalt</label>` : ''}
    <div class="sheet-fuss"><button class="knopf rahmen" type="button" data-zu>Abbrechen</button><button class="knopf" type="submit">${neu ? 'Anlegen' : 'Speichern'}</button></div>
  </form>`);
  const form = $('form', s);
  setTimeout(() => { if (neu) feldVon(form, 'name').focus(); }, 300);
  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = feldVon(form, 'name').value.trim(); if (!name){ toast('Bitte einen Namen eingeben.', 'fehler'); feldVon(form, 'name').focus(); return; }
    const farbe = gewaehlteChips($('[data-gruppe="farbe"]', s))[0] || farbe0;
    if (neu){
      const id = neueId('h');
      D.haushalte[id] = { id, name, farbe, stand:Date.now(), spiele:[], geloescht:{} };
      markiere(id, 'Haushalt angelegt');
      const mein = feldVon(form, 'mein');
      if (mein && mein.checked){ E.meinHaushalt = id; einstSpeichern(); }
    } else {
      Object.assign(D.haushalte[h.id], { name, farbe, stand:Date.now() });
      markiere(h.id, 'Name/Farbe geändert');
    }
    speichern(); s.schliessen(); renderAlles(); syncBald();
    toast(neu ? `„${name}“ angelegt` : 'Gespeichert');
    if (danach) setTimeout(danach, 260);
  });
}
async function haushaltLoeschen(id){
  const h = D.haushalte[id]; if (!h) return;
  const m = D.meta[id] || {};
  if (!await frage(`„${h.name}“ löschen?`, `Der Haushalt und seine ${h.spiele.length} Spiele verschwinden auf allen Geräten. Das lässt sich nur über eine Sicherung zurückholen.`, 'Endgültig löschen')) return;
  if (m.aufServer){
    if (!E.token){ toast('Zum Löschen braucht diese App den Schlüssel.', 'fehler'); return; }
    try{
      const r = await gh('GET', `/contents/daten/${dateiName(id)}?ref=${encodeURIComponent(E.branch)}`);
      if (r.ok){
        const j = await r.json();
        const d = await gh('DELETE', `/contents/daten/${dateiName(id)}`, { message:`Haushalt ${h.name} gelöscht`, sha:j.sha, branch:E.branch });
        if (!d.ok && d.status !== 404) throw await fehlerAus(d, 'Löschen');
      } else if (r.status !== 404) throw await fehlerAus(r, 'Löschen');
    }catch(e){ toast(e.message, 'fehler'); return; }
  }
  for (const s of h.spiele) if (s.bild) fotoWeg(s.bild);
  delete D.haushalte[id]; delete D.meta[id];
  if (E.meinHaushalt === id){ E.meinHaushalt = ''; einstSpeichern(); }
  speichern(); renderAlles(); syncBald(); toast(`„${h.name}“ gelöscht`);
}
